spring:
  application:
    name: fides-secura
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bank}
    username: ${POSTGRES_USER:bank}
    password: ${POSTGRES_PASSWORD:bank}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret-key}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: http://localhost:5173
  auth:
    max-failed-logins: 5
    lockout-minutes: 15
    login-rate-limit-per-ip: 30

logging:
  level:
    com.bank: INFO
